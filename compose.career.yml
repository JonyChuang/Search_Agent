name: search-agent-career

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: search_agent
      MYSQL_USER: career
      MYSQL_PASSWORD: ${CAREER_MYSQL_PASSWORD:?Set CAREER_MYSQL_PASSWORD in the local environment}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - career_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  career_mysql_data:
